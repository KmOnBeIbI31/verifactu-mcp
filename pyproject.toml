[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifactu-mcp"
version = "0.1.1"
description = "MCP server para integrar VeriFactu (AEAT) con Claude Code y Cursor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
verifactu-mcp = "verifactu_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verifactu_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["."]
# smoke_test.py NO es un test pytest — pega contra la API real
python_files = ["test_*.py"]

